<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #333;
        }
        
        h1 {
            color: #2c3e50;
            margin-bottom: 30px;
        }
        
        .game-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 80%;
            max-width: 600px;
            text-align: center;
        }
        
        .choices {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
        }
        
        .choice {
            cursor: pointer;
            background-color: #f8f9fa;
            border: 2px solid #dee2e6;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            transition: transform 0.2s, background-color 0.2s;
        }
        
        .choice:hover {
            transform: scale(1.1);
            background-color: #e9ecef;
        }
        
        .result {
            margin: 20px 0;
            font-size: 1.2rem;
            min-height: 60px;
        }
        
        .scoreboard {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-top: 20px;
            font-size: 1.2rem;
        }
        
        .highlight {
            color: #2980b9;
            font-weight: bold;
        }
        
        .reset-btn {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            transition: background-color 0.2s;
        }
        
        .reset-btn:hover {
            background-color: #2980b9;
        }
        
        .game-history {
            margin-top: 30px;
            width: 100%;
            max-height: 150px;
            overflow-y: auto;
            padding: 10px;
            border-top: 1px solid #dee2e6;
        }
        
        .history-item {
            padding: 5px;
            border-bottom: 1px solid #f0f0f0;
        }
        
        @media (max-width: 600px) {
            .choices {
                flex-direction: column;
                align-items: center;
            }
            
            .choice {
                margin: 10px 0;
            }
        }
    </style>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    
    <div class="game-container">
        <div class="scoreboard">
            <div>You: <span id="user-score">0</span></div>
            <div>Computer: <span id="computer-score">0</span></div>
        </div>
        
        <div class="choices">
            <div class="choice" id="rock">✊</div>
            <div class="choice" id="paper">✋</div>
            <div class="choice" id="scissors">✌️</div>
        </div>
        
        <div class="result" id="result">Choose your weapon!</div>
        
        <button class="reset-btn" id="reset">Reset Game</button>
        
        <div class="game-history">
            <h3>Game History</h3>
            <div id="history"></div>
        </div>
    </div>
    
    <script>
        // Game variables
        let userScore = 0;
        let computerScore = 0;
        const userScoreSpan = document.getElementById('user-score');
        const computerScoreSpan = document.getElementById('computer-score');
        const resultDiv = document.getElementById('result');
        const rockDiv = document.getElementById('rock');
        const paperDiv = document.getElementById('paper');
        const scissorsDiv = document.getElementById('scissors');
        const resetBtn = document.getElementById('reset');
        const historyDiv = document.getElementById('history');
        
        // Event listeners
        rockDiv.addEventListener('click', () => game('rock'));
        paperDiv.addEventListener('click', () => game('paper'));
        scissorsDiv.addEventListener('click', () => game('scissors'));
        resetBtn.addEventListener('click', resetGame);
        
        // Get computer choice
        function getComputerChoice() {
            const choices = ['rock', 'paper', 'scissors'];
            const randomNumber = Math.floor(Math.random() * 3);
            return choices[randomNumber];
        }
        
        // Convert choice to emoji
        function convertToEmoji(choice) {
            switch(choice) {
                case 'rock': return '✊';
                case 'paper': return '✋';
                case 'scissors': return '✌️';
                default: return '';
            }
        }
        
        // Win function
        function win(userChoice, computerChoice) {
            userScore++;
            userScoreSpan.innerHTML = userScore;
            const smallUserWord = "you".fontsize(3).sup();
            const smallCompWord = "comp".fontsize(3).sup();
            resultDiv.innerHTML = `${convertToEmoji(userChoice)} ${smallUserWord} beats ${convertToEmoji(computerChoice)} ${smallCompWord}. You win! 🔥`;
            document.getElementById(userChoice).classList.add('highlight');
            setTimeout(() => document.getElementById(userChoice).classList.remove('highlight'), 500);
            addToHistory(`You chose ${userChoice}, computer chose ${computerChoice}. You win!`);
        }
        
        // Lose function
        function lose(userChoice, computerChoice) {
            computerScore++;
            computerScoreSpan.innerHTML = computerScore;
            const smallUserWord = "you".fontsize(3).sup();
            const smallCompWord = "comp".fontsize(3).sup();
            resultDiv.innerHTML = `${convertToEmoji(computerChoice)} ${smallCompWord} beats ${convertToEmoji(userChoice)} ${smallUserWord}. You lose... 💧`;
            document.getElementById(userChoice).classList.add('highlight');
            setTimeout(() => document.getElementById(userChoice).classList.remove('highlight'), 500);
            addToHistory(`You chose ${userChoice}, computer chose ${computerChoice}. You lose.`);
        }
        
        // Draw function
        function draw(userChoice, computerChoice) {
            const smallUserWord = "you".fontsize(3).sup();
            const smallCompWord = "comp".fontsize(3).sup();
            resultDiv.innerHTML = `${convertToEmoji(userChoice)} ${smallUserWord} equals ${convertToEmoji(computerChoice)} ${smallCompWord}. It's a draw! 🤝`;
            document.getElementById(userChoice).classList.add('highlight');
            setTimeout(() => document.getElementById(userChoice).classList.remove('highlight'), 500);
            addToHistory(`You chose ${userChoice}, computer chose ${computerChoice}. It's a draw.`);
        }
        
        // Main game function
        function game(userChoice) {
            const computerChoice = getComputerChoice();
            
            switch (userChoice + computerChoice) {
                case 'rockscissors':
                case 'paperrock':
                case 'scissorspaper':
                    win(userChoice, computerChoice);
                    break;
                case 'rockpaper':
                case 'paperscissors':
                case 'scissorsrock':
                    lose(userChoice, computerChoice);
                    break;
                case 'rockrock':
                case 'paperpaper':
                case 'scissorsscissors':
                    draw(userChoice, computerChoice);
                    break;
            }
        }
        
        // Reset game function
        function resetGame() {
            userScore = 0;
            computerScore = 0;
            userScoreSpan.innerHTML = userScore;
            computerScoreSpan.innerHTML = computerScore;
            resultDiv.innerHTML = "Choose your weapon!";
            historyDiv.innerHTML = "";
        }
        
        // Add to history function
        function addToHistory(message) {
            const historyItem = document.createElement('div');
            historyItem.classList.add('history-item');
            historyItem.textContent = message;
            historyDiv.prepend(historyItem);
            
            // Limit history items
            if (historyDiv.children.length > 10) {
                historyDiv.removeChild(historyDiv.lastChild);
            }
        }
    </script>
</body>
</html>
