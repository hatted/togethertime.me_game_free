<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; }
        .choices { margin: 30px 0; }
        button { font-size: 24px; margin: 10px; padding: 15px 20px; cursor: pointer; }
        .result { font-size: 20px; margin: 20px 0; }
        .score { font-size: 18px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Rock Paper Scissors</h1>
    
    <div class="choices">
        <button onclick="play('rock')">🪨 Rock</button>
        <button onclick="play('paper')">📄 Paper</button>
        <button onclick="play('scissors')">✂️ Scissors</button>
    </div>
    
    <div class="result" id="result"></div>
    <div class="score">
        Player: <span id="playerScore">0</span> | 
        Computer: <span id="computerScore">0</span>
    </div>
    
    <script>
        let playerScore = 0;
        let computerScore = 0;
        
        function play(playerChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const computerChoice = choices[Math.floor(Math.random() * 3)];
            
            let result = '';
            if (playerChoice === computerChoice) {
                result = `Tie! Both chose ${playerChoice}`;
            } else if (
                (playerChoice === 'rock' && computerChoice === 'scissors') ||
                (playerChoice === 'paper' && computerChoice === 'rock') ||
                (playerChoice === 'scissors' && computerChoice === 'paper')
            ) {
                result = `You win! ${playerChoice} beats ${computerChoice}`;
                playerScore++;
            } else {
                result = `You lose! ${computerChoice} beats ${playerChoice}`;
                computerScore++;
            }
            
            document.getElementById('result').textContent = result;
            document.getElementById('playerScore').textContent = playerScore;
            document.getElementById('computerScore').textContent = computerScore;
        }
    </script>
</body>
</html>
